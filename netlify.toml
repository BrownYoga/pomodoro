[build]
  command = "pnpm test:unit && pnpm build"
  publish = "dist"

# Serve the Vue app for client-side routes, while preserving real static files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
